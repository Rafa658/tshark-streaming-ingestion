[tool.poetry]
name = "tshark-streaming-ingestion"
version = "0.1.0"
description = "Streaming pipeline that ingests tshark packet capture data via MQTT into PostgreSQL with TimescaleDB"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"

[tool.poetry.group.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
pytest-cov = "*"
testcontainers = "*"
# runtime deps needed to import the workspace packages under test
paho-mqtt = "*"
psycopg = {extras = ["binary"], version = "*"}
loguru = "*"
prometheus-client = "*"
pydantic-settings = "*"
psutil = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
    "packages/shared/src",
    "services/ingestor/src",
    "services/worker-postgres/src",
]
testpaths = ["packages", "services"]