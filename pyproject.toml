[tool.poetry]
# The repo root is a workspace container, not a distributable package. The three
# real packages live in packages/ and services/ and are installed from here in
# editable mode so tests can import them without a per-package install dance.
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
tshark-shared = { path = "packages/shared", develop = true }
ingestor = { path = "services/ingestor", develop = true }
worker-postgres = { path = "services/worker-postgres", develop = true }

[tool.poetry.group.dev.dependencies]
ruff = "*"
mypy = "*"
pytest = "*"
pytest-cov = "*"
testcontainers = "*"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "packages/shared/tests",
    "services/ingestor/tests",
    "services/worker-postgres/tests",
]
markers = [
    "integration: tests that need Docker (mosquitto/timescaledb via testcontainers)",
]