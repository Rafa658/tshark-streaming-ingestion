services:
  postgres:
    image: timescale/timescaledb:latest-pg18
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tshark_user
      POSTGRES_PASSWORD: tshark_password
      POSTGRES_DB: tshark_db
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - ingestion-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tshark_user -d tshark_db"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  ingestion-net:
    external: true