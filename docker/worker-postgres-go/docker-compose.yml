services:
  worker-postgres-go:
    build:
      context: ../../services/worker-postgres-go
      dockerfile: Dockerfile
    container_name: worker-postgres-go
    environment:
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://tshark_user:tshark_password@postgres:5432/tshark_db}
      POSTGRES_TABLE: ${POSTGRES_TABLE_GO:-packets_go}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MQTT_CLIENT_ID: worker-postgres-go-1
      GOMEMLIMIT: 18MiB
    ports:
      - "${WORKER_GO_METRICS_PORT:-8003}:8000"
    networks:
      - ingestion-net
    healthcheck:
      test: ["CMD", "/worker", "-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  ingestion-net:
    external: true
